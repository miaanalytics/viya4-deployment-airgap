## Cluster
NAMESPACE: demo

##
## Private Ingress 
##
V4_CFG_INGRESS_TYPE: contour
V4_CFG_INGRESS_MODE: "private"

##
## CR Access
##
V4_CFG_CR_URL: "855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline" # update this for your account and region, note "/viya" must match your viya namespace

##
## Baseline configs are specifically for repos that use OCI for helm charts (like ECR)
##

# Auto-Scaler
CLUSTER_AUTOSCALER_CHART_URL: "" # yes we want this blank because of how the ansible helm module expects OCI to be passed
CLUSTER_AUTOSCALER_CHART_NAME: oci://855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/cluster-autoscaler
CLUSTER_AUTOSCALER_LOCATION: il-central-1
CLUSTER_AUTOSCALER_CONFIG:
  awsRegion: "{{ CLUSTER_AUTOSCALER_LOCATION }}"
  autoDiscovery:
    clusterName: "{{ CLUSTER_NAME }}"
  rbac:
    serviceAccount:
      name: cluster-autoscaler
      annotations:
        eks.amazonaws.com/role-arn: "{{ CLUSTER_AUTOSCALER_ACCOUNT }}"
  image:
    repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/registry.k8s.io/autoscaling/cluster-autoscaler
  extraEnv:
    AWS_STS_REGIONAL_ENDPOINTS: regional # use regional endpoints instead
  extraArgs:
    aws-use-static-instance-list: true # this keeps autoscaler from going to the internet for the ec2 list on init, auto-scaler will fail in darksite without this

# CSI NFS
CSI_DRIVER_NFS_CHART_URL: ""
CSI_DRIVER_NFS_CHART_NAME: oci://855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/csi-driver-nfs
CSI_DRIVER_NFS_CONFIG:
  driver:
    mountPermissions: "0777"
  storageClass:
    create: true
    name: sas
    annotations:
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    parameters:
      server: "{{ V4_CFG_RWX_FILESTORE_ENDPOINT }}"
      share: "{{ '/ontap' if STORAGE_TYPE_BACKEND == 'ontap' else (V4_CFG_RWX_FILESTORE_PATH if (STORAGE_TYPE_BACKEND == 'netapp' and NETAPP_VOLUME_PATH | length > 0) else ('/pvs' if PROVIDER != 'azure' else (V4_CFG_RWX_FILESTORE_PATH | replace('/$', '') ~ '/pvs'))) }}"
      subDir: ${pvc.metadata.namespace}-${pvc.metadata.name}-${pv.metadata.name}
      mountPermissions: "0777"
    # EFS
    mountOptions: 
      # - vers=4.1
      # - noatime
      # - nodiratime
      # - rsize=262144
      # - wsize=262144
      - noresvport
      - rsize=1048576
      - wsize=1048576
      - soft
      - timeo=600
      - retrans=2
      - _netdev
  image:
    baseRepo: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/registry.k8s.io
    nfs:
        repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/registry.k8s.io/sig-storage/nfsplugin
    csiProvisioner:
        repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/registry.k8s.io/sig-storage/csi-provisioner
    csiResizer:
        repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/registry.k8s.io/sig-storage/csi-resizer
    csiSnapshotter:
        repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/registry.k8s.io/sig-storage/csi-snapshotter
    livenessProbe:
        repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/registry.k8s.io/sig-storage/livenessprobe
    nodeDriverRegistrar:
        repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/registry.k8s.io/sig-storage/csi-node-driver-registrar
    externalSnapshotter:
        repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/registry.k8s.io/sig-storage/snapshot-controller

# EBS CSI DRIVER
EBS_CSI_DRIVER_CHART_URL: "" # yes we want this blank because of how the ansible helm module expects OCI to be passed
EBS_CSI_DRIVER_CHART_NAME: oci://855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/aws-ebs-csi-driver
EBS_CSI_DRIVER_LOCATION: il-central-1
EBS_CSI_DRIVER_CONFIG:
  controller:
    k8sTagClusterId: "{{ CLUSTER_NAME }}"
    region: "{{ EBS_CSI_DRIVER_LOCATION }}"
    extraVolumeTags: "{{ EBS_CSI_DRIVER_TAGS }}"
    serviceAccount:
      create: true
      name: ebs-csi-controller-sa
      annotations:
        eks.amazonaws.com/role-arn: "{{ EBS_CSI_DRIVER_ACCOUNT }}"
  storageClasses:
    - name: "{{ EBS_CSI_RABBITMQ_STORAGE_CLASS_NAME }}"
      parameters:
        type: "{{ EBS_CSI_RABBITMQ_STORAGE_CLASS_VOLUME_TYPE }}"
        fstype: ext4
        iops: "{{ EBS_CSI_RABBITMQ_STORAGE_CLASS_IOPS | int }}"
        throughput: "{{ EBS_CSI_RABBITMQ_STORAGE_CLASS_THROUGHPUT | int }}"
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
    - name: "{{ EBS_CSI_CRUNCHY_STORAGE_CLASS_NAME }}"
      parameters:
        type: "{{ EBS_CSI_CRUNCHY_STORAGE_CLASS_VOLUME_TYPE }}"
        fstype: ext4
        iops: "{{ EBS_CSI_CRUNCHY_STORAGE_CLASS_IOPS | int }}"
        throughput: "{{ EBS_CSI_CRUNCHY_STORAGE_CLASS_THROUGHPUT | int }}"
      reclaimPolicy: "{{ EBS_CSI_CRUNCHY_STORAGE_CLASS_RECLAIM_POLICY }}"
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
  image:
    repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/public.ecr.aws/ebs-csi-driver/aws-ebs-csi-driver
  sidecars:
    provisioner:
      image:
        repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/public.ecr.aws/eks-distro/kubernetes-csi/external-provisioner
    attacher:
      image:
        repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/public.ecr.aws/eks-distro/kubernetes-csi/external-attacher
    snapshotter:
      image:
        repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/public.ecr.aws/eks-distro/kubernetes-csi/external-snapshotter/csi-snapshotter
    livenessProbe:
      image:
        repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/public.ecr.aws/eks-distro/kubernetes-csi/livenessprobe
    resizer:
      image:
        repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/public.ecr.aws/eks-distro/kubernetes-csi/external-resizer
    nodeDriverRegistrar:
      image:
        repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/public.ecr.aws/eks-distro/kubernetes-csi/node-driver-registrar
    volumemodifier:
      image:
        repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/public.ecr.aws/ebs-csi-driver/volume-modifier-for-k8s


# Contour
CONTOUR_CHART_URL: ""
CONTOUR_CHART_NAME: oci://855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/contour
CONTOUR_CONFIG:
  contour:
    image:
      registry: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline
      repository: ghcr.io/projectcontour/contour
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 1Gi
  envoy:
    image:
      registry: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline
      repository: docker.io/envoyproxy/envoy
    tolerations:
      - key: workload.sas.com/class
        operator: Exists
        effect: NoSchedule
    service:
      loadBalancerSourceRanges: "{{ LOADBALANCER_SOURCE_RANGES | default(['0.0.0.0/0'], -1) }}"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

## Metrics-server config
METRICS_SERVER_CHART_URL: ""
METRICS_SERVER_CHART_NAME: oci://855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/metrics-server
METRICS_SERVER_CONFIG:
  apiService:
    create: true
  image:
    repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/registry.k8s.io/metrics-server/metrics-server
  addonResizer:
    image:
      repository: 855334947981.dkr.ecr.il-central-1.amazonaws.com/sas/baseline/registry.k8s.io/autoscaling/addon-resizer